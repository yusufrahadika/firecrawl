name: Deploy Playwright Stealth Variants to GHCR

on:
  push:
    branches:
      - stealth-browser-build
    paths:
      - apps/playwright-service-ts/**
      - .github/workflows/deploy-playwright.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        browser_variant:
          - cloakbrowser
          - camoufox
          - invisible_playwright
        platform:
          - name: linux/amd64
            runner: blacksmith-4vcpu-ubuntu-2404
            suffix: linux-amd64
          - name: linux/arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
            suffix: linux-arm64
    defaults:
      run:
        working-directory: './apps/playwright-service-ts'
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@main

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@ef12d5b165b596e3aa44ea8198d8fde563eab402 # v1

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repo Owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}
        env:
          GITHUB_REPOSITORY_OWNER: '${{ github.repository_owner }}'

      - name: 'Build and Push Stealth Variant Image'
        uses: useblacksmith/build-push-action@30c71162f16ea2c27c3e21523255d209b8b538c1 # v2
        with:
          context: ./apps/playwright-service-ts
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/playwright-service:${{ matrix.browser_variant }}-${{ matrix.platform.suffix }}
          platforms: ${{ matrix.platform.name }}
          provenance: false
          build-args: |
            BROWSER_VARIANT=${{ matrix.browser_variant }}

  manifest:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: build
    strategy:
      matrix:
        browser_variant:
          - cloakbrowser
          - camoufox
          - invisible_playwright
    steps:
      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repo Owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}
        env:
          GITHUB_REPOSITORY_OWNER: '${{ github.repository_owner }}'

      - name: 'Create and Push Stealth Variant Multi-Arch Manifest'
        run: |
          docker manifest create ghcr.io/${{ env.REPO_OWNER }}/playwright-service:latest-${{ matrix.browser_variant }} \
            ghcr.io/${{ env.REPO_OWNER }}/playwright-service:${{ matrix.browser_variant }}-linux-amd64 \
            ghcr.io/${{ env.REPO_OWNER }}/playwright-service:${{ matrix.browser_variant }}-linux-arm64
          docker manifest push ghcr.io/${{ env.REPO_OWNER }}/playwright-service:latest-${{ matrix.browser_variant }}
